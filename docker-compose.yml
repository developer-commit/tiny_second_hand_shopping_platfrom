version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - PORT=8080
      - STATIC_DIR=/app/dist
      - DATABASE_URL=postgres://root:secret@db:5432/app_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_key_change_me
      - ENCRYPTION_KEY=32_byte_aes_gcm_key_change_me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # 컨테이너 내 업로드 이미지가 호스트 PC에 유지되도록 볼륨 설정
      - upload_data:/app/uploads
    networks:
      - rust_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - rust_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rust_network
    restart: unless-stopped

networks:
  rust_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  upload_data: # 이미지 저장용 볼륨