[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/frontend",
    "crates/backend",
]

[workspace.dependencies]
shared = { path = "crates/shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }