services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: escrow-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bch_user
      POSTGRES_PASSWORD: bch_password
      POSTGRES_DB: bch_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bch_user -d bch_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
